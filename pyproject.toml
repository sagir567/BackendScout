[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-scout"
version = "0.1.0"
description = "A local-first agent for finding, evaluating, and tracking backend engineering job applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "openai>=1.0",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
  "keyring>=25.0",
  "playwright>=1.48",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
backend-scout = "backend_scout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:anyio"]
