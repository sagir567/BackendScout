<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
    <title>Example Skyhawk | Junior Backend Engineer</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Junior Backend Engineer",
        "hiringOrganization": {"@type": "Organization", "name": "Example Skyhawk"}
      }
    </script>
    <style>
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif; }
      label { display: block; margin: 1rem 0; }
      input, textarea { display: block; max-width: 100%; }
      footer { margin-top: 3rem; border-top: 1px solid #aaa; }
    </style>
  </head>
  <body>
    <main>
      <h1>Example Skyhawk</h1>
      <h2 id="job-title">Junior Backend Engineer</h2>
      <form id="application-form" aria-labelledby="job-title" method="post">
        <label for="full-name">Full name
          <input id="full-name" name="full_name" autocomplete="name" required>
        </label>
        <label for="email">Email
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>
        <label for="phone">Phone
          <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        </label>
        <label for="linkedin">LinkedIn profile
          <input id="linkedin" name="linkedin" type="url">
        </label>
        <label for="cv">CV
          <input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx" required>
        </label>
        <label for="cover-letter">Cover letter
          <textarea id="cover-letter" name="cover_letter" rows="5" required></textarea>
        </label>
        <button type="submit">Submit application</button>
      </form>
    </main>
    <footer>
      <h2>Contact us</h2>
      <form id="contact-form" method="post" onsubmit="event.preventDefault()">
        <label for="contact-name">Name <input id="contact-name" name="contact_name" required></label>
        <label for="contact-email">Email <input id="contact-email" name="contact_email" type="email" required></label>
        <label for="contact-message">Message <textarea id="contact-message" name="message" required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </footer>
    <script>
      window.sent = 0;
      window.received = null;
      const form = document.getElementById("application-form");
      form.onsubmit = (event) => {
        event.preventDefault();
        const file = form.querySelector('input[type="file"]').files[0];
        window.sent += 1;
        window.received = {
          filename: file ? file.name : "",
          size: file ? file.size : 0,
          marketing: false,
          answers: Object.fromEntries([...new FormData(form)].filter(([, value]) => typeof value === "string"))
        };
        window.setTimeout(() => {
          const receipt = document.createElement("p");
          receipt.id = "receipt";
          receipt.setAttribute("role", "status");
          receipt.textContent = "Your application has been submitted.";
          form.after(receipt);
        }, 150);
      };
    </script>
  </body>
</html>
