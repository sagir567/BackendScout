# This private presentation contract is applied to every generated CV.
# Copy it to config/cv_style.yaml, then edit the TODO rules as your preferences evolve.
include_headline: false
target_page_count: 1
show_raw_urls: false
link_labels:
  https://github.com/username: GitHub
  https://github.com/organization: Project GitHub
  https://linkedin.com/in/username: LinkedIn
writing_rules:
  - Use concise, professional language.
  - Preserve ownership qualifiers such as AI-assisted, directed, reviewed, or collaborated when evidence contains them.
  - Never include raw URLs in visible CV text. Render known links as meaningful hyperlink labels.
  - Keep technical skills in the Technical Skills section and weave only relevant skills naturally into the summary and evidence-backed bullets.
  - Include a project or its repository link only when its selection keywords are explicitly relevant to the target job.
  - Prefer additional relevant work evidence over unrelated projects when filling the one-page CV.
  - TODO Add a presentation preference after reviewing a draft.
tailoring_guidance:
  - Use precise technology names from the evidence. For example, describe verified C# and .NET 8 work as C#/.NET 8 experience; do not imply Kotlin, AWS, or SaaS experience unless evidence supports it.
  - Keep small cloud practice in the Cloud and Infrastructure skills group rather than presenting it as a standalone project.
